[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "open-plant-pulse-hub"
version = "0.1.0.dev0"
description = "Local-first desktop hub for Open Plant Pulse sensors"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Open Plant Pulse contributors" }]
dependencies = [
    "bleak>=0.22,<3",
]

[project.scripts]
open-plant-pulse-hub = "open_plant_pulse_hub.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
mqtt = ["paho-mqtt>=2.1,<3"]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/open_plant_pulse_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"