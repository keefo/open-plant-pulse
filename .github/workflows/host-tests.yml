name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  protocols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bill of materials
        run: python3 scripts/validate-bom.py
      - name: Compile and run protocol tests
        run: sh scripts/test-sensor.sh
      - name: Run desktop hub tests
        run: PYTHONPATH=hub/src python3 -m unittest discover -s hub/tests -v