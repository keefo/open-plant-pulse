<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 720" width="1220" height="720" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .box { fill: #f7f7f5; stroke: #333; stroke-width: 2; rx: 8; }
    .title { font-size: 16px; font-weight: bold; fill: #222; }
    .sub { font-size: 12px; fill: #666; }
    .pin { font-size: 13px; fill: #222; }
    .wlabel { font-size: 12px; fill: #444; }
    .dot { fill: #222; }
    .pos { stroke: #d62728; stroke-width: 3; fill: none; }
    .gnd { stroke: #222; stroke-width: 3; fill: none; }
    .v5 { stroke: #ff7f0e; stroke-width: 3; fill: none; }
    .v33 { stroke: #c9a400; stroke-width: 3; fill: none; }
    .sig { stroke: #1f77b4; stroke-width: 3; fill: none; }
    .res { fill: #fff; stroke: #333; stroke-width: 2; }
  </style>

  <rect x="0" y="0" width="1220" height="720" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#222">HX711 scale: current wiring</text>
  <text x="30" y="58" class="sub">ESP32-WROVER dev board, powered from a 1S2P 18650 pack through an MT3608 boost set to 5.0 V</text>

  <!-- Legend -->
  <g transform="translate(860,24)">
    <line x1="0" y1="8" x2="26" y2="8" class="pos"/><text x="32" y="12" class="wlabel">Battery + (3.0–4.2 V)</text>
    <line x1="170" y1="8" x2="196" y2="8" class="v5"/><text x="202" y="12" class="wlabel">5.0 V</text>
    <line x1="0" y1="28" x2="26" y2="28" class="v33"/><text x="32" y="32" class="wlabel">3.3 V</text>
    <line x1="170" y1="28" x2="196" y2="28" class="gnd"/><text x="202" y="32" class="wlabel">GND</text>
    <line x1="0" y1="48" x2="26" y2="48" class="sig"/><text x="32" y="52" class="wlabel">Signal</text>
  </g>

  <!-- ===== Wires (drawn first, boxes on top) ===== -->

  <!-- USB-C into IP2312 -->
  <line x1="130" y1="92" x2="130" y2="120" class="v5"/>
  <polygon points="124,112 136,112 130,122" fill="#ff7f0e"/>
  <text x="140" y="104" class="wlabel">USB-C 5 V (charging)</text>

  <!-- Battery + rail: IP2312 B+ to battery +, tap to MT3608 VIN+ and divider -->
  <line x1="180" y1="230" x2="180" y2="330" class="pos"/>
  <line x1="180" y1="280" x2="340" y2="280" class="pos"/>
  <circle cx="180" cy="280" r="5" class="dot"/>
  <circle cx="270" cy="280" r="5" class="dot"/>
  <line x1="270" y1="280" x2="270" y2="455" class="pos"/>

  <!-- Battery divider to GPIO34 -->
  <line x1="270" y1="515" x2="270" y2="545" class="sig"/>
  <circle cx="270" cy="530" r="5" class="dot"/>
  <path d="M270 530 H392 a8 8 0 0 1 16 0 H452 a8 8 0 0 1 16 0 H570" class="sig"/>
  <line x1="270" y1="605" x2="270" y2="660" class="gnd"/>

  <!-- GND bus -->
  <line x1="30" y1="660" x2="1010" y2="660" class="gnd"/>
  <!-- IP2312 B- to bus -->
  <path d="M50 200 H30 V660" class="gnd"/>
  <!-- Battery - to bus -->
  <line x1="130" y1="440" x2="130" y2="660" class="gnd"/>
  <!-- MT3608 GNDs to bus -->
  <line x1="400" y1="340" x2="400" y2="660" class="gnd"/>
  <line x1="460" y1="340" x2="460" y2="660" class="gnd"/>
  <!-- ESP32 GND to bus -->
  <line x1="675" y1="580" x2="675" y2="660" class="gnd"/>
  <circle cx="130" cy="660" r="5" class="dot"/>
  <circle cx="270" cy="660" r="5" class="dot"/>
  <circle cx="400" cy="660" r="5" class="dot"/>
  <circle cx="460" cy="660" r="5" class="dot"/>
  <circle cx="675" cy="660" r="5" class="dot"/>
  <!-- ground symbol -->
  <g transform="translate(1010,660)">
    <line x1="0" y1="0" x2="0" y2="14" class="gnd"/>
    <line x1="-14" y1="14" x2="14" y2="14" class="gnd"/>
    <line x1="-9" y1="20" x2="9" y2="20" class="gnd"/>
    <line x1="-4" y1="26" x2="4" y2="26" class="gnd"/>
  </g>
  <text x="560" y="690" class="wlabel">All grounds are tied together</text>

  <!-- MT3608 VOUT+ to ESP32 5V -->
  <line x1="490" y1="280" x2="570" y2="280" class="v5"/>
  <text x="500" y="270" class="wlabel">5.0 V</text>

  <!-- ESP32 to HX711 -->
  <line x1="780" y1="270" x2="870" y2="270" class="v33"/>
  <text x="800" y="262" class="wlabel">3.3 V</text>
  <line x1="780" y1="330" x2="870" y2="330" class="gnd"/>
  <line x1="780" y1="400" x2="870" y2="400" class="sig"/>
  <polygon points="790,394 790,406 780,400" fill="#1f77b4"/>
  <line x1="780" y1="460" x2="870" y2="460" class="sig"/>
  <polygon points="860,454 860,466 870,460" fill="#1f77b4"/>

  <!-- HX711 to load cell -->
  <line x1="1010" y1="270" x2="1080" y2="270" stroke="#d62728" stroke-width="5"/>
  <line x1="1010" y1="330" x2="1080" y2="330" stroke="#222" stroke-width="5"/>
  <line x1="1010" y1="400" x2="1080" y2="400" stroke="#888" stroke-width="7"/>
  <line x1="1010" y1="400" x2="1080" y2="400" stroke="#fff" stroke-width="4"/>
  <line x1="1010" y1="460" x2="1080" y2="460" stroke="#2ca02c" stroke-width="5"/>
  <text x="1025" y="262" class="wlabel">red</text>
  <text x="1025" y="322" class="wlabel">black</text>
  <text x="1025" y="392" class="wlabel">white</text>
  <text x="1025" y="452" class="wlabel">green</text>

  <!-- ===== Components ===== -->

  <!-- IP2312 -->
  <rect x="50" y="122" width="190" height="108" class="box"/>
  <text x="66" y="150" class="title">IP2312 charger</text>
  <text x="66" y="168" class="sub">2.1 A, charges to 4.2 V</text>
  <text x="60" y="205" class="pin">B−</text>
  <circle cx="50" cy="200" r="4" class="dot"/>
  <text x="168" y="222" class="pin">B+</text>
  <circle cx="180" cy="230" r="4" class="dot"/>

  <!-- Battery pack -->
  <rect x="50" y="330" width="190" height="110" class="box"/>
  <text x="66" y="356" class="title">18650 pack, 1S2P</text>
  <text x="66" y="374" class="sub">2 cells in parallel</text>
  <text x="66" y="390" class="sub">3.0–4.2 V</text>
  <!-- cell symbols -->
  <g stroke="#333" stroke-width="2">
    <line x1="165" y1="400" x2="165" y2="428"/><line x1="173" y1="406" x2="173" y2="422" stroke-width="4"/>
    <line x1="195" y1="400" x2="195" y2="428"/><line x1="203" y1="406" x2="203" y2="422" stroke-width="4"/>
  </g>
  <text x="188" y="324" class="pin">+</text>
  <circle cx="180" cy="330" r="4" class="dot"/>
  <text x="118" y="434" class="pin">−</text>
  <circle cx="130" cy="440" r="4" class="dot"/>

  <!-- Divider resistors -->
  <rect x="260" y="455" width="20" height="60" class="res"/>
  <text x="288" y="490" class="wlabel">R1 1 MΩ</text>
  <rect x="260" y="545" width="20" height="60" class="res"/>
  <text x="288" y="580" class="wlabel">R2 1 MΩ</text>
  <text x="288" y="522" class="wlabel">Vbat ÷ 2</text>

  <!-- MT3608 -->
  <rect x="340" y="230" width="150" height="110" class="box"/>
  <text x="356" y="256" class="title">MT3608 boost</text>
  <text x="356" y="274" class="sub">set to 5.0 V</text>
  <text x="350" y="300" class="pin">VIN+</text>
  <circle cx="340" cy="280" r="4" class="dot"/>
  <text x="436" y="300" class="pin">VOUT+</text>
  <circle cx="490" cy="280" r="4" class="dot"/>
  <text x="372" y="333" class="pin">VIN−</text>
  <circle cx="400" cy="340" r="4" class="dot"/>
  <text x="436" y="333" class="pin">VOUT−</text>
  <circle cx="460" cy="340" r="4" class="dot"/>

  <!-- ESP32 -->
  <rect x="570" y="200" width="210" height="380" class="box"/>
  <text x="590" y="228" class="title">ESP32-WROVER</text>
  <text x="590" y="246" class="sub">dev board</text>
  <text x="580" y="285" class="pin">5V (in)</text>
  <circle cx="570" cy="280" r="4" class="dot"/>
  <text x="580" y="535" class="pin">GPIO34</text>
  <circle cx="570" cy="530" r="4" class="dot"/>
  <text x="658" y="572" class="pin">GND</text>
  <circle cx="675" cy="580" r="4" class="dot"/>
  <text x="732" y="275" class="pin">3V3</text>
  <circle cx="780" cy="270" r="4" class="dot"/>
  <text x="732" y="335" class="pin">GND</text>
  <circle cx="780" cy="330" r="4" class="dot"/>
  <text x="712" y="405" class="pin">GPIO32</text>
  <circle cx="780" cy="400" r="4" class="dot"/>
  <text x="712" y="465" class="pin">GPIO33</text>
  <circle cx="780" cy="460" r="4" class="dot"/>

  <!-- HX711 -->
  <rect x="870" y="220" width="140" height="280" class="box"/>
  <text x="900" y="246" class="title">HX711</text>
  <text x="880" y="275" class="pin">VCC</text>
  <circle cx="870" cy="270" r="4" class="dot"/>
  <text x="880" y="335" class="pin">GND</text>
  <circle cx="870" cy="330" r="4" class="dot"/>
  <text x="880" y="405" class="pin">DT</text>
  <circle cx="870" cy="400" r="4" class="dot"/>
  <text x="880" y="465" class="pin">SCK</text>
  <circle cx="870" cy="460" r="4" class="dot"/>
  <text x="975" y="275" class="pin">E+</text>
  <circle cx="1010" cy="270" r="4" class="dot"/>
  <text x="975" y="335" class="pin">E−</text>
  <circle cx="1010" cy="330" r="4" class="dot"/>
  <text x="975" y="405" class="pin">A−</text>
  <circle cx="1010" cy="400" r="4" class="dot"/>
  <text x="975" y="465" class="pin">A+</text>
  <circle cx="1010" cy="460" r="4" class="dot"/>

  <!-- Load cell -->
  <rect x="1080" y="230" width="110" height="260" class="box"/>
  <text x="1094" y="258" class="title">Load cell</text>
  <text x="1094" y="276" class="sub">4-wire bar</text>
  <rect x="1098" y="340" width="74" height="22" fill="#cfd8dc" stroke="#555" stroke-width="1.5"/>
  <circle cx="1122" cy="351" r="6" fill="#fff" stroke="#555"/>
  <circle cx="1148" cy="351" r="6" fill="#fff" stroke="#555"/>

  <!-- Warning -->
  <rect x="800" y="540" width="390" height="64" fill="#fff4e5" stroke="#e69500" stroke-width="1.5" rx="6"/>
  <text x="814" y="564" font-size="13" font-weight="bold" fill="#8a5a00">No battery protection board yet</text>
  <text x="814" y="584" font-size="12" fill="#8a5a00">Nothing stops the cells from over-discharging.</text>
  <text x="814" y="598" font-size="12" fill="#8a5a00">Add a 1S DW01 board (3 A+) between pack and loads.</text>
</svg>
